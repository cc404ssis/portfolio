ean: free. New sensor: $30 to $90.","diff":"Easy","fx":[{"t":"Sensor clips into its holder: squeeze the tabs and pull, or twist it out","b":"Usual Mercedes practice; the W220 holder was not seen","s":"clip"},{"t":"2-pin connector with a locking tab: press the tab, then pull","s":"plug"},{"t":"Under-tray or lower grille screws if you need room: likely T25 Torx or 8 mm hex, about 4 to 6","s":"screw"}]},{"id":"F2","g":"fix","title":"A/C condenser, gas and compressor","parts":["condenser","acComp","fan","radiator"],"where":"The condenser sits right at the front, in front of the radiator behind the grille. The A/C compressor is on the engine, driven by the belt. The electric fan is behind the radiator.","verdict":"These are the usual real reasons a W220 stops cooling: low gas from a leak (often a stone-damaged condenser), a fan not running, or a worn compressor. Added here because the TikTok tip alone is unlikely to fix it.","check":["Make sure the A/C is really on: on the climate panel the economy (ECON or snowflake off) setting must not be active.","Engine running, A/C on: the electric fan behind the grille should run.","Look at the condenser through the grille for stone dents, oily patches or crushed fins.","Have an A/C shop measure the gas pressures. Low gas means a leak somewhere."],"fixSteps":["Leak test with UV dye, then fix the leak.","Regas to the correct amount.","Leaking condenser: replace it.","Replace the compressor only if it is proven faulty."],"partsList":"R134a gas, UV dye, O-rings. Maybe a condenser or compressor.","cost":"Check and regas: $200 to $450 (NZ adds a levy on R134a). Condenser fitted: $600 to $1,200. Compressor fitted: $1,200 to $2,500.","diff":"Workshop (A/C gear and licence needed)","fx":[{"t":"Condenser pipe joints: block fittings, 1 bolt each (likely 10 mm or Torx). Gas must be recovered first: A/C shop only","s":"fit"},{"t":"Condenser sits on rubber-mounted pegs and clips to the radiator","s":"clip"},{"t":"A/C compressor mounting bolts, 3 or 4, likely 13 mm or E-Torx","s":"bolt"},{"t":"Compressor connector with a locking tab","s":"plug"},{"t":"A/C service ports (L and H) with screw caps, open by hand. Exact spot UNVERIFIED","s":"fit"},{"t":"Belt tensioner: turn it with a spanner or socket on the tensioner bolt (likely 17 mm) to slip the belt off","s":"bolt"},{"t":"Fan connector with a locking tab","s":"plug"},{"t":"Top radiator trim and fan shroud: screws or clips, likely T25 or 8 mm","s":"screw"}]},{"id":"F3","g":"fix","title":"Camshaft solenoids and cam sensor","parts":["camL","camR","engine"],"where":"Front face of the engine, at the top of each cylinder head (one each side of the V).","quote":"TikTok tip 2: \"If your car is hard to start when cold and makes a rattling noise, remove this bolt beneath the oil cap. Pull out the camshaft solenoid valve... clean it thoroughly.\"","verdict":"Not as shown. Your M112 V6 has no plug-in valve under the oil cap. The parts that do this job are bolted to the front of the heads. Their known fault on Mercedes engines of this age is oil seeping out through the electrical plug into the wiring.","check":["Engine cold. Unplug the electrical plugs on the front of each cylinder head.","Look for oil inside the plug or oily wiring.","Get the fault codes read. Camshaft timing codes point here.","A rattle on a cold start can also be the timing chain. Have it listened to."],"fixSteps":["If a plug is oily, replace the leaking part (magnet or sensor).","Clean the plug with contact cleaner and let it dry.","If oil has run a long way up the wiring, have a workshop check the loom."],"partsList":"Cam adjuster magnet or cam position sensor, contact cleaner.","cost":"Code read: $60 to $120. Sensor: $60 to $180. Magnet: $150 to $350.","diff":"Medium","fx":[{"t":"Left magnet: held by bolts, likely 3 Torx (T30 or E8 on similar Mercedes engines). The M112 count is UNVERIFIED","s":"bolt"},{"t":"Right magnet: same as the left, likely 3 Torx bolts","s":"bolt"},{"t":"Left magnet connector: lift the locking tab gently, then pull. Look for oil inside","s":"plug"},{"t":"Right magnet connector: same, check for oil","s":"plug"},{"t":"Engine cover: pulls straight up off rubber grommets, no screws","s":"clip"},{"t":"Cam position sensor: 1 bolt (likely 10 mm or Torx) plus a connector. Position UNVERIFIED","s":"bolt"}]},{"id":"F4","g":"fix","title":"Throttle body (idle problem)","parts":["throttle","intake","airbox"],"where":"Top front centre of the engine, where the big air intake pipe joins.","quote":"TikTok tip 3: \"If fuel consumption increases, the idle becomes unstable and acceleration is poor... remove the idle air control valve from the throttle body. Clean it.\"","verdict":"Not as shown. Your car has an electronic (drive by wire) throttle and no separate idle valve. The same idea still works on the throttle body itself: carbon build-up causes rough idle.","check":["Rough or hunting idle, stalling, or a throttle warning on the dash: likely.","Remove the intake pipe and look at the flap. A black carbon ring means it needs a clean.","Also check the air filter. A blocked filter gives the same symptoms."],"fixSteps":["Ignition OFF and key out.","Remove the intake pipe from the throttle body.","Spray throttle body cleaner on a rag and wipe the bore and flap. Do not force the flap by hand.","Refit, start, and let it idle 5 minutes to relearn."],"partsList":"Throttle body cleaner, rag. Maybe an air filter.","cost":"DIY: $15 to $30. Workshop: $120 to $200.","diff":"Easy to medium","fx":[{"t":"Air duct to throttle body: hose clamp (worm drive, 7 mm or flat blade) or a spring clip","s":"clip"},{"t":"Throttle body to manifold: 4 bolts, likely Torx T30 or 5 mm Allen. Only remove it if cleaning in place is not enough","s":"bolt"},{"t":"Throttle connector with a locking tab. Ignition OFF before you unplug it","s":"plug"},{"t":"Air filter lid: spring clips or screws (likely T25)","s":"clip"},{"t":"Intake duct joints: push-fit with clips","s":"clip"}]},{"id":"F5","g":"fix","title":"Brake booster check valve","parts":["checkValve","brakeRes","booster","masterCyl"],"where":"Back of the engine bay on the driver side (right side on a right-hand drive car), behind the brake fluid reservoir, where the vacuum hose plugs into the round brake booster.","quote":"TikTok tip 4: \"If the brake pedal kicks back and feels soft or hard at different times, locate the brake fluid reservoir. Find this small component behind it... clean off the oil sludge.\"","verdict":"Partly. The part in the video is the vacuum check valve on the brake booster. Checking it is fine, but brakes are safety critical. A soft or changing pedal needs a proper brake check first.","check":["Engine off. Pump the pedal 5 times, hold it down, then start the engine. The pedal should sink a little. If not, booster vacuum is suspect.","Check fluid level and colour in the reservoir. Dark fluid is overdue for a change.","Look at the vacuum hose and check valve for cracks, oil or looseness.","A hissing sound near the pedal points to a booster leak."],"fixSteps":["Cracked or oily check valve or grommet: replace it (cheap).","Brake fluid: flush every 2 years.","Anything else: take it to a brake specialist."],"partsList":"Booster check valve and grommet, DOT 4 brake fluid.","cost":"Check valve: $20 to $70. Fluid flush: $90 to $160.","diff":"Easy check. Brake repairs: workshop.","fx":[{"t":"Check valve: push-fit in a rubber grommet in the booster. Twist and pull. Fit a new grommet","s":"fit"},{"t":"Vacuum hose: push-on, sometimes held by a spring clamp","s":"clip"},{"t":"Reservoir cap: unscrew by hand. Keep dirt out","s":"fit"},{"t":"Fluid level sensor connector","s":"plug"},{"t":"Master cylinder to booster: 2 nuts, likely 13 mm. Workshop job","s":"bolt"},{"t":"Brake pipe nuts, likely 11 mm flare nuts. Workshop job: the brakes must be bled after","s":"fit"}]},{"id":"F6","g":"fix","title":"Oxygen (lambda) sensors","parts":["o2a","o2b","o2c","o2d"],"where":"Underneath the car, screwed into the exhaust pipes. Your V6 has four: two before the catalytic converters and two after.","quote":"TikTok tip 5: \"If your car consumes too much fuel and black smoke comes out of the exhaust... take out the oxygen sensor and clean off the accumulated dust and oil sludge.\"","verdict":"Rarely helps. Cleaning does not bring back a worn oxygen sensor and can damage it. Black smoke on a petrol car means it is running rich, so read the codes first.","check":["Get the fault codes read. Oxygen sensor codes say which one (bank 1 or 2, before or after the cat).","Check the air filter and the air flow (MAF) sensor. Both are cheap causes of rich running.","Listen for exhaust leaks near the front pipes."],"fixSteps":["Replace only the sensor the codes point to.","Use a proper sensor socket and anti-seize on the thread.","Clear the codes and drive."],"partsList":"Oxygen sensor, sensor socket.","cost":"$120 to $300 per sensor. Fitted: $250 to $450.","diff":"Medium (threads often seize)","safety":true,"fx":[{"t":"Left front sensor: 22 mm (7/8 in) sensor socket, M18 x 1.5 thread","b":"Industry standard size for this type of sensor","s":"bolt"},{"t":"Right front sensor: 22 mm sensor socket","b":"Industry standard size","s":"bolt"},{"t":"Left rear sensor: 22 mm sensor socket","b":"Industry standard size","s":"bolt"},{"t":"Right rear sensor: 22 mm sensor socket","b":"Industry standard size","s":"bolt"},{"t":"Sensor plugs: connectors with locking tabs, clipped to a bracket up beside the gearbox","s":"plug"},{"t":"Under-tray screws, likely T25 Torx or 8 mm, about 6 to 10","s":"screw"}]},{"id":"F7","g":"fix","title":"Your data plate (the photo)","parts":["plate"],"where":"Door pillar or door frame, where your photo was taken. Which side and exact spot is UNVERIFIED from the photo.","verdict":"Your photo is the car's identity plate, not a list of faults. It confirms the model, so the parts and locations on this page match your car. The fixes come from the TikTok you sent.","fx":[{"t":"Riveted or glued on. Nothing to undo: leave it in place","s":"clip"}]},{"id":"S1","g":"stereo","title":"COMAND head unit (note the pattern)","parts":["comand"],"where":"Centre of the dashboard. It is the master of the fibre optic audio loop.","check":["When sound drops, does the screen stay on? Screen on, sound gone: the loop or a boot module (the CD changer, amp, phone and fibre loop cards). Whole unit restarts: power or battery (the battery and front audio fuses cards).","Does it happen on radio AND CD? Both: amp, loop or power. Radio only: aerial (the aerial amplifier card).","Note when: over bumps, on hot days, after rain, or when starting. Write it down."],"fixSteps":["Treat the COMAND itself as the last suspect, after every other stereo card.","If proven faulty: specialist repair or a used unit with coding."],"partsList":"Nothing to start with.","cost":"Repair: $300 to $700. Used unit: $200 to $500 plus coding.","diff":"Workshop","fx":[{"t":"Torx screws under the ashtray, likely 2. One W220 owner found these on an Audio 10 radio car; COMAND may differ","b":"MB Club W220 thread (Audio 10, not COMAND)","s":"screw"},{"t":"Screws holding the unit or its frame, likely 2 Torx (same owner report)","s":"screw"},{"t":"Wood trim around the unit: clips. Prise with a plastic trim tool, never a screwdriver","s":"clip"},{"t":"D2B fibre optic plug at the back: the COMAND is on the fibre loop","b":"MB Club 2001 W220 sound thread, InCarTec","s":"fit"},{"t":"Power and speaker connector block and aerial plugs at the back. Disconnect the battery first","s":"plug"}]},{"id":"S2","g":"stereo","title":"Battery, pre-fuse box and charging","parts":["battery","bootFuse","alternator"],"where":"The W220 battery is in the boot, right side, under the floor. The boot pre-fuse box (X4/22) is behind the right boot lining next to it (w220.wiki).","check":["Multimeter: engine off 12.4 to 12.7 V. Engine running 13.8 to 14.6 V.","Most battery shops test free.","Check the terminals and earth strap are tight and clean.","Look at the pre-fuse box for green corrosion or a loose stud nut."],"fixSteps":["Clean and tighten the terminals.","Weak battery: replace it with the correct size and type.","Low charging voltage: have the alternator tested."],"partsList":"Battery if it fails the test.","cost":"Test: free. Battery: $300 to $500.","diff":"Easy","fx":[{"t":"Negative terminal nut, likely 10 mm. Undo the negative first, refit it last","b":"Same-era Mercedes W211 guide uses 10 mm","s":"bolt"},{"t":"Positive terminal nut under the red cover, likely 10 mm","s":"bolt"},{"t":"Hold-down bracket bolt, likely 13 mm","b":"W211 guide uses 13 mm","s":"bolt"},{"t":"Vent hose: push-fit on the battery (an AGM battery has none)","s":"fit"},{"t":"Boot floor panel lifts out. Right side trim is held by plastic nuts or clips","s":"clip"},{"t":"Boot pre-fuse box X4/22 is here, behind the right boot lining","b":"w220.wiki Fuses","s":"fuse"},{"t":"Pre-fuse box: cover clips, big feeds on studs with nuts (likely 10 or 13 mm). Battery off first","s":"bolt"},{"t":"Alternator main cable nut, likely 13 mm, under a rubber boot. Battery off first","s":"bolt"},{"t":"Alternator regulator connector","s":"plug"}]},{"id":"S3","g":"stereo","title":"Audio fuses (front fuse box)","parts":["fuseL"],"where":"Front left fuse box at the back of the engine bay on the left side, under its cover by the windscreen (w220.wiki).","check":["Open the fuse box. The chart in the lid lists radio, CD changer and sound system fuses.","Pull each audio fuse, check it, and push it back in firmly.","Green or white corrosion: clean the slot or replace the fuse."],"fixSteps":["Replace any blown or corroded fuse with the same rating.","A fuse that keeps blowing means a short: workshop."],"partsList":"Mini fuses.","cost":"$5 to $20.","diff":"Easy","fx":[{"t":"Fuse box cover: clips or quarter-turn catches along the edge. Lift it off by hand","s":"clip"},{"t":"F23 7.5 A CD changer, F24 20 A car audio, F25 25 A sound system. Check your lid chart: numbers changed during production","b":"w220.wiki Fuses, left fuse box","s":"fuse"},{"t":"Fuse puller clipped inside the box or lid","s":"clip"}]},{"id":"S4","g":"stereo","title":"Rear fuse module and water check","parts":["rearFuse"],"where":"Rear fuse and relay module K40/5, under the right rear seat (w220.wiki).","check":["Lift the rear seat cushion. Look for damp carpet, water marks or green corrosion.","Check the fuses in this box, including F60 (aerial amplifier).","Also lift the boot floor and side trims and feel for damp."],"fixSteps":["Dry everything out and clean any corrosion.","Find the leak (boot seal, rear window, aerial or tail light seals).","On the W220 the usual causes in that corner are a perished foam seal behind the tail light housing, or blocked rubber drain channels running down from the rear window C-pillar. Fix the leak before fitting any new audio part (Gemini chat, PDF p4)."],"partsList":"Fuses, contact cleaner, maybe seals.","cost":"$0 to $20 to check. Leak repair varies.","diff":"Easy","fx":[{"t":"Rear seat cushion: pull up firmly at the front edge to unclip it","s":"clip"},{"t":"Module K40/5 sits here, under the right rear seat. Aerial amp fuse F60 7.5 A is in it","b":"w220.wiki Fuses","s":"fuse"},{"t":"Module cover: clips","s":"clip"}]},{"id":"S5","g":"stereo","title":"CD changer (prime suspect)","parts":["cdc"],"where":"In the boot, left side, behind the grey carpet liner. Not right against the tail light: pull the liner further back toward the rear wheel arch to find the metal bracket it sits on (Gemini chat, PDF p6). Your photo shows it there (PDF p7).","check":["Remove the left boot trim. Look for damp or corrosion on the changer and plugs.","Eject test: car and radio on, press the eject button on the changer. No whirring and the magazine stays in: the changer has no power or is dead, and that breaks the loop (Gemini chat, PDF p3, p5, p7).","Bypass test: unplug the changer and join its two fibre ends with a D2B loop connector.","Use the car for a week. Problem gone: the changer was the fault."],"fixSteps":["Leave it bypassed (you lose the CD changer only), or fit a good used changer.","Keep fibre ends clean and never bend the fibre tightly."],"partsList":"D2B fibre bypass loop connector (ask Mercedes parts or an audio shop), or a used changer.","cost":"Bypass: $20 to $60. Used changer: $80 to $250.","diff":"Easy to medium","fx":[{"t":"Left boot side trim: plastic nuts, push clips and the bag hook screws. Lift the boot floor first","s":"clip"},{"t":"Changer bracket: 3 or 4 nuts or screws, likely 10 mm or T25","s":"bolt"},{"t":"D2B fibre plug (two fibres): the changer is on the fibre loop. Unplug here for the bypass test","b":"MB Club, InCarTec","s":"fit"},{"t":"Power connector with a locking tab","s":"plug"}]},{"id":"S6","g":"stereo","title":"Sound amplifier","parts":["amp"],"where":"In the boot, left side behind the trim, on the same bracket as the CD changer, likely directly below it, deeper in the cavity (Gemini chat, PDF p5, p7). Bose-equipped cars have the Bose amp here.","check":["Look for damp or water stains around the amp and its plugs.","Feel the foam and floor under the bracket. Damp, wet or a mildew smell: dry it out now, water shorts the amp (Gemini chat, PDF p2, p3).","Car off, key out. Unplug each amp harness and look at the pins: green, white, rusty or burnt pins mean a failing connection. Push each plug back until it clicks, then test the sound (Gemini chat, PDF p1, p3, p7).","Feel if it is very hot after a long drive.","A workshop with Mercedes diagnosis can see which unit breaks the loop."],"fixSteps":["Dry and clean if damp.","Faulty amp: repair or a used one with the same part number.","If bypassing the CD changer does not bring the sound back, or the amp plugs are badly corroded, the amp needs replacing (Gemini chat, PDF p7)."],"partsList":"Used amp with matching part number.","cost":"$150 to $500.","diff":"Medium","fx":[{"t":"Amp mounting: 3 or 4 nuts, likely 10 mm","s":"bolt"},{"t":"D2B fibre plug: the amp is on the fibre loop","b":"MB Club, MBWorld","s":"fit"},{"t":"Power and speaker connectors with locking levers. Reseat firmly until they click and check the pins for corrosion","b":"Gemini chat, PDF p1, p3, p7","s":"plug"}]},{"id":"S7","g":"stereo","title":"Phone and voice control modules","parts":["bootMods"],"where":"In the boot, behind the trim (if fitted). Exact position on your car is UNVERIFIED.","check":["Find which modules are fitted (look for fibre optic plugs, usually orange or black twin fibres).","Bypass each one in turn, as with the CD changer."],"fixSteps":["A dead phone module you never use can stay bypassed."],"partsList":"D2B loop connector.","cost":"$20 to $60.","diff":"Easy to medium","fx":[{"t":"Module bracket screws, likely T25 or 10 mm","s":"screw"},{"t":"Fibre plug if this unit is on the loop (look for twin orange or black fibres)","s":"fit"}]},{"id":"S8","g":"stereo","title":"Fibre optic audio loop (D2B)","parts":["fibre"],"where":"Runs from the COMAND under the centre console and floor to the boot modules and back.","check":["System on: gently unplug a fibre plug in the boot. Red light should come out of one fibre.","No red light: the break is before that point.","Make sure every plug is fully clipped in."],"fixSteps":["Reseat plugs and clean the fibre ends with a lint-free cloth.","Replace any damaged fibre section."],"partsList":"Fibre repair section if needed.","cost":"$0 to $150. Workshop loop test: $120 to $200.","diff":"Medium","fx":[{"t":"Sill and centre console trims: push clips. The fibre runs underneath","s":"clip"},{"t":"Inline fibre joint where the loop enters the boot","s":"fit"}]},{"id":"S9","g":"stereo","title":"Radio aerial amplifiers","parts":["aerialL","aerialR"],"where":"The radio aerial is in the rear window. Its amplifiers are near the top of the rear window under the headlining. Exact spot UNVERIFIED.","check":["Does it drop in the same places each time? That is normal reception.","Drops anywhere, even in town: check the aerial amp plug and fuse F60 (the rear fuse module card)."],"fixSteps":["Reseat plugs, replace the aerial amplifier if faulty."],"partsList":"Aerial amplifier.","cost":"$80 to $300.","diff":"Medium","fx":[{"t":"Rear headlining edge and C-pillar trims: push clips. Prise gently, they break when cold","s":"clip"},{"t":"Left aerial amp: 1 or 2 screws, likely T20 or 7 mm","s":"screw"},{"t":"Right aerial amp: 1 or 2 screws, likely T20 or 7 mm","s":"screw"},{"t":"Aerial coax plugs, push-in type","s":"plug"},{"t":"Aerial amp fuse F60 7.5 A, in the module under the right rear seat","b":"w220.wiki Fuses","s":"fuse"}]},{"id":"A1","g":"air","title":"Level button: the raise test","parts":["lvlBtn"],"where":"The ride height button with the car and up arrow symbol, in the centre console area. Exact spot UNVERIFIED.","check":["Engine running, press the level button once. The car should rise within about 30 seconds.","Listen at the front right bumper. You should hear the compressor hum.","Note the dash message. \"AIRMATIC VISIT WORKSHOP\" means a fault is stored. \"Car too low\" or \"Stop car too low\" means it cannot hold or build pressure.","Park on flat ground overnight. Measure each wheel arch to the ground before and after."],"fixSteps":["No hum: go to the compressor relay and fuse card.","Hum but slow or no rise: the compressor, valve block and strut cards.","Sinks overnight: the low corner points to the leak."],"partsList":"Tape measure.","cost":"Free.","diff":"Easy","safety":true,"fx":[{"t":"Nothing to undo for the test. The switch prises out of the console with a trim tool if it ever needs replacing","s":"clip"}]},{"id":"A2","g":"air","title":"Compressor relay O and fuse F32","parts":["fuseR"],"where":"Front right fuse box at the back of the engine bay on the right side. Relay position \"O\", fuse F32 (40 A) (w220.wiki).","check":["Pull fuse F32 and check it.","Swap relay O with an identical relay, or fit a new one.","Repeat the raise test (the level button card)."],"fixSteps":["Replace the relay. Always fit a new relay when replacing the compressor.","Fuse blows again: find the short or a seized compressor."],"partsList":"Airmatic compressor relay (w220.wiki lists A 002 542 13 19), 40 A fuse.","cost":"Relay: $40 to $120. Fuse: $5.","diff":"Easy","fx":[{"t":"Fuse box cover: clips or quarter-turn catches. Lift it off by hand","s":"clip"},{"t":"Fuse F32, 40 A: air suspension compressor","b":"w220.wiki Fuses","s":"fuse"},{"t":"Relay O: switches the Airmatic compressor","b":"w220.wiki Fuses","s":"fuse"},{"t":"The relay pulls straight up. Rock it gently, no tools needed","s":"clip"}]},{"id":"A3","g":"air","title":"Airmatic compressor","parts":["amComp"],"where":"Front right, behind the bumper below the headlight. Reached through the wheel arch liner.","check":["During the raise test: no hum and relay is good, check for power at its plug.","Hum but slow rise: worn compressor or a leak.","Hot and cutting out: suspect a leak making it overwork."],"fixSteps":["Fix any leak first.","Replace the compressor and the relay together."],"partsList":"Airmatic compressor, relay.","cost":"Aftermarket compressor: $400 to $900. Fitted: $700 to $1,300.","diff":"Medium to workshop","safety":true,"fx":[{"t":"Front right wheel: 5 wheel bolts, 17 mm. Use the torque in your handbook","b":"Mercedes standard wheel bolt size","s":"bolt"},{"t":"Front right wheel arch liner: plastic clips and nuts. Sizes UNVERIFIED","b":"General Mercedes compressor guide (youcanic)","s":"clip"},{"t":"Compressor held by 3 bolts on a bracket. They rust: soak them in penetrating oil first. Bolt size UNVERIFIED","b":"W220 owner, MB Club","s":"bolt"},{"t":"Air line: threaded fitting, turn anticlockwise. Release pressure first","b":"General Mercedes guide","s":"fit"},{"t":"Compressor power connector (and temperature sensor plug) with locking tabs","s":"plug"}]},{"id":"A4","g":"air","title":"Valve block","parts":["valveBlk"],"where":"Next to the compressor, front right. Exact mounting UNVERIFIED.","check":["Compressor running: spray soapy water on the block and its pipe joints. Bubbles mean a leak."],"fixSteps":["Replace the valve block or reseal the leaking fitting."],"partsList":"Valve block or fittings.","cost":"$300 to $700 for the part.","diff":"Medium","fx":[{"t":"Valve block connector with a locking tab","s":"plug"},{"t":"Air line fittings, about 5 (one per strut, the tank, the supply). Soapy-water test each one","s":"fit"},{"t":"Mounting nuts, likely 10 mm","s":"bolt"}]},{"id":"A5","g":"air","title":"Front air struts","parts":["strutFL","strutFR"],"where":"Inside each front wheel arch. The top is under the bonnet on the strut tower.","check":["Measure arch heights in the evening and again in the morning.","Spray soapy water on the strut top and its air fitting (bonnet open)."],"fixSteps":["Replace the leaking strut.","Check the air fitting on top at the same time."],"partsList":"Front Airmatic strut.","cost":"Aftermarket: $500 to $900 each. Fitted: $800 to $1,300 each. Genuine costs more.","diff":"Workshop","safety":true,"fx":[{"t":"Right strut top: nuts on the strut tower under the bonnet, likely 3","s":"bolt"},{"t":"Left strut top: nuts on the strut tower, likely 3","s":"bolt"},{"t":"Right air inlet with a brass residual pressure holding valve. A special socket exists for it. Never undo it under pressure","b":"w220.wiki Special tools","s":"fit"},{"t":"Left air inlet with a brass residual pressure holding valve","b":"w220.wiki Special tools","s":"fit"},{"t":"Right lower strut bolt to the control arm. Workshop torque","s":"bolt"},{"t":"Left lower strut bolt to the control arm","s":"bolt"},{"t":"Wheel bolts x5 each side, 17 mm","b":"Mercedes standard wheel bolt size","s":"bolt"}]},{"id":"A6","g":"air","title":"Rear air struts","parts":["strutRL","strutRR"],"where":"Inside each rear wheel arch.","check":["Measure arch heights over about 10 hours without moving the car.","Soapy water on the air fitting at the top."],"fixSteps":["Replace the leaking strut."],"partsList":"Rear Airmatic strut.","cost":"$400 to $800 each. Fitted: $650 to $1,100 each.","diff":"Workshop","safety":true,"fx":[{"t":"Right top mount nuts, reached from inside the boot or under the parcel shelf","s":"bolt"},{"t":"Left top mount nuts, same access","s":"bolt"},{"t":"Right air inlet with a brass residual pressure holding valve","b":"w220.wiki: one at each air inlet","s":"fit"},{"t":"Left air inlet with a brass residual pressure holding valve","b":"w220.wiki: one at each air inlet","s":"fit"},{"t":"Right lower strut bolt","s":"bolt"},{"t":"Left lower strut bolt","s":"bolt"}]},{"id":"A7","g":"air","title":"Level sensors","parts":["lvlFL","lvlFR","lvlR"],"where":"Three of them: one on each front lower arm and one on the rear axle.","check":["Look under each one for a snapped or loose link rod.","A workshop can read each sensor's value with Mercedes diagnosis."],"fixSteps":["Replace the link rod or sensor."],"partsList":"Level sensor or link rod.","cost":"$150 to $400.","diff":"Medium","safety":true,"fx":[{"t":"Front right sensor: 2 bolts, likely 10 mm. The link rod pops off its ball joint","s":"bolt"},{"t":"Front left sensor: 2 bolts, likely 10 mm, plus the link rod","s":"bolt"},{"t":"Front right sensor connector","s":"plug"},{"t":"Front left sensor connector","s":"plug"},{"t":"Rear sensor: 2 bolts, likely 10 mm, plus the link rod","s":"bolt"},{"t":"Rear sensor connector","s":"plug"}]},{"id":"A8","g":"air","title":"Pressure reservoir","parts":["reservoir"],"where":"Front left, behind the bumper.","check":["Soapy water on its fitting and pipe while the compressor runs."],"fixSteps":["Reseal or replace the fitting."],"partsList":"Fitting or reservoir.","cost":"$200 to $500.","diff":"Medium","fx":[{"t":"Tank strap or mounting nuts, likely 10 mm","s":"bolt"},{"t":"Air line fitting: soapy-water test it","s":"fit"}]},{"id":"D1","g":"scan","title":"Suction fan circuit (two fan fault codes): do this first","parts":["fanCtl"],"where":"Behind the radiator, inside the fan shroud. The fan, its built-in control module and the 4-pin plug are one unit.","verdict":"The fan open circuit code says the engine computer sees an open circuit on the electric suction fan. The fan output code says the A/C asked for a fan speed that did not make sense, and tells you to check the suction fan. Both point at the same part. My best read is that the open circuit causes the \"implausible fan output\", so fixing the fan should clear both. I am about 70% sure. No source ties these two codes together directly.","check":["Engine warm, A/C on: stand at the front. Does the fan run at all? Run it for a few minutes. Note whether it runs slowly, fast, or not at all.","Wiggle the fan plug and its wires by hand with the fan running. A stutter or stop points at the plug or wiring.","Look at the 4-pin plug for green or burnt pins. Clean with contact cleaner.","Engine off, plug off, ignition on: with a multimeter check the ground, 12 V constant and 12 V ignition pins (w220.wiki lists the wire roles).","All three good but the fan never runs: the fan unit or its module is bad. Replace the fan as one unit.","Speed signal missing from the engine computer side: wiring or ME2 fault. This is rarer. Have a workshop trace it."],"fixSteps":["Repair the plug or wiring if you find damage.","Otherwise fit a new fan unit. Part number is UNCONFIRMED for your S320: w220.wiki lists A 220 500 01 93 (600 W) for the S500, S450 and S350. Check it against your chassis number.","Clear the codes. Drive and run the A/C. Rescan the engine module AND the A/C module (see the fix order)."],"partsList":"Suction fan unit with built-in module. OE A 220 500 01 93 listed for other W220 petrol models (w220.wiki). UNCONFIRMED for the S320.","cost":"Rough guess only: used fan $150 to $400, new $400 to $900, fitting 1 to 2 hours.","diff":"Medium. Shroud and fan come out from the top.","fx":[]},{"id":"D2","g":"scan","title":"A/C compressor torque code","parts":["acComp"],"where":"The compressor is low on the engine, belt driven (see the A/C condenser and gas card). The scan text says to see the A/C control module.","verdict":"The compressor torque code \"AC compressor torque implausible\", stored. The W220 compressor is a variable displacement unit with no magnetic clutch (w220.wiki), so the engine computer has to estimate how much load the A/C puts on the engine. If the A/C pressure reading is off, or the condenser is not being cooled because the fan is dead, that estimate can look wrong. That is a theory, UNCONFIRMED. Do not buy a compressor for this code.","check":["Fix the suction fan circuit first, clear codes, drive, rescan.","If the compressor torque code returns: read the A/C module live data and compare the refrigerant pressure with a manifold gauge on the high side (see the A/C pressure card).","Pressures good and the code stays: only then look at the compressor."],"fixSteps":["Replace the compressor only if it is proven faulty (the A/C condenser and gas card)."],"partsList":"None until proven.","cost":"None until proven. Compressor fitted: $1,200 to $2,500 (v6 figure).","diff":"Workshop (A/C gear and licence needed)","fx":[]},{"id":"D3","g":"scan","title":"A/C refrigerant pressure sensor B12 (no code for it in this scan)","parts":["acPress","acTemp","recDrier"],"where":"On the receiver drier, front left of the engine bay, right next to the refrigerant temperature sensor B12/1. The A/C shop must empty the gas before it is swapped.","verdict":"Plainly: this scan holds NO refrigerant pressure sensor code. The A/C module (AAC/TAC) is not in the list of 27 systems the tool found, so it was never read, and a sensor fault would be stored there, not in the engine module. So there is no proof the sensor is bad. It is only a suspect because the compressor torque code and the fan output code are both A/C-related. Test it before you buy it.","check":["Rescan, including the A/C module.","Live pressure against a gauge (see above).","Fix the suction fan circuit first. A dead fan alone can make A/C pressures and the torque estimate look wrong."],"fixSteps":["Only if the sensor is proven wrong: recover the gas, swap the sensor with a new O-ring, evacuate and regas."],"partsList":"Pressure sensor B12: genuine A 639 542 08 18 (supersedes A 140 830 00 72), or Thermotec KTT130013, NRF 38941, Hella 6ZL 351 028-161, Mahle ASE 17 000P, Denso DPS17003. Not confirmed against your chassis number. Plus O-ring and R134a gas (3 candidate numbers above, all UNCONFIRMED).","cost":"Rough guess only: sensor $40 to $150, A/C shop recover and regas $200 to $450 (v6 figure).","diff":"Workshop (the gas has to be recovered)","fx":[]},{"id":"D4","g":"scan","title":"Coolant thermostat (thermostat code, current)","parts":["thermo"],"where":"In the thermostat housing at the front of the engine, on the coolant pipes. The exact spot on the M112 is UNVERIFIED.","verdict":"The thermostat code, shown as \"Coolant thermostat\", status stored AND current. It is the only code active right now. The usual meaning of this code is that the engine is not reaching its proper temperature fast enough, most often a thermostat stuck open. That is the generic meaning, not a Mercedes document. It does not look related to the fan or A/C codes.","check":["Live coolant temperature on a drive.","Dash gauge versus scan reading.","Heater output once warm."],"fixSteps":["Engine cold. Drain some coolant, replace the thermostat and its seal, refill with the correct Mercedes coolant and bleed the system.","Clear the code and drive. If it comes back, check the coolant temperature sensor."],"partsList":"Thermostat (A 112 203 02 75, UNCONFIRMED for your car), seal, coolant.","cost":"Rough guess only: part $30 to $100, fitted $250 to $500.","diff":"Medium","fx":[]}]}</script>

function kyY(x,y,em){let m=(S.fb||innerHeight)-em;const k=S.bk;if(k&&x>k.l-em&&x<k.r+em)m=Math.min(m,k.t-18);return Math.max(em,Math.min(m,y))}
function kyOut(x,y){const k=S.bk;return !!k&&x>k.l-24&&x<k.r+24&&y>k.t-18}
function declutter(force){
 if(!camera||!pinList.length)return;
 pinList.forEach(sp=>{sp.userData.hid=0});
 const want=pinList.filter(sp=>sp.userData.want);
 const ch=$('#chips').getBoundingClientRect(),TS=ch.height?ch.bottom+26:0;
 const pts=[];want.forEach(sp=>{const q=pinScreen(sp);if(!q)return;const sideOut=innerWidth<=900&&(q.x<40||q.x>innerWidth-40);const FBm=(S.fb||innerHeight)-(mobile()?24:40),lowOut=innerWidth<=900&&q.y>FBm;const edge=(q.y<TS||sideOut||lowOut||(innerWidth<=900&&kyOut(q.x,q.y)))&&S.sel!==sp.userData.part;if(edge&&q.y<TS)q.y=TS;if(innerWidth<=900&&q.y>FBm)q.y=FBm;if(sideOut){const em=mobile()?24:40;q.x=Math.max(em,Math.min(innerWidth-em,q.x))}if(innerWidth<=900&&S.sel!==sp.userData.part)q.y=Math.min(q.y,kyY(q.x,q.y,mobile()?24:40));pts.push({sp,q,id:sp.userData.part,edge})});
 pts.sort((a,b)=>(S.sel===b.id)-(S.sel===a.id));
 const used=new Set(),cls=[];
 pts.forEach(a=>{if(used.has(a))return;used.add(a);const m=[a];
  if(S.sel!==a.id)pts.forEach(b=>{if(used.has(b)||S.sel===b.id)return;if(Math.hypot(a.q.x-b.q.x,a.q.y-b.q.y)<CLR){used.add(b);m.push(b)}});
  cls.push(m)});
 for(let g=0;g<8;g++){let mg=false;const cen=m=>{let x=m.reduce((a,p)=>a+p.q.x,0)/m.length,y=m.reduce((a,p)=>a+p.q.y,0)/m.length;if(innerWidth<=900){const em=mobile()?24:40;x=Math.max(em,Math.min(innerWidth-em,x));y=kyY(x,y,em)}return {x,y}};
  outer:for(let i=0;i<cls.length;i++)for(let j=i+1;j<cls.length;j++){if(S.sel&&(cls[i][0].id===S.sel||cls[j][0].id===S.sel))continue;const a=cen(cls[i]),b=cen(cls[j]);if(Math.hypot(a.x-b.x,a.y-b.y)<CLR+8+(innerWidth<=900?6:0)){cls[i]=cls[i].concat(cls[j]);cls.splice(j,1);mg=true;break outer}}
  if(!mg)break}
 const selC=S.sel&&cls.find(m=>m[0].id===S.sel);
 if(selC){const sq=selC[0].q;for(let i=cls.length-1;i>=0;i--){const m=cls[i];if(m===selC)continue;const mx=m.reduce((t,p)=>t+p.q.x,0)/m.length,my=m.reduce((t,p)=>t+p.q.y,0)/m.length;if(Math.hypot(mx-sq.x,my-sq.y)<52){m.forEach(p=>p.sp.userData.hid=1);cls.splice(i,1)}}}
 const sig=cls.map(m=>m.length+(m[0].edge?'e':'')+':'+Math.round(m[0].q.x)+','+Math.round(m[0].q.y)).join('|')+S.sys+S.sel;
 if(sig===clSig&&!force)return;clSig=sig;
 const host=$('#cl');let k=0;
 pinList.forEach(sp=>{sp.visible=!!sp.userData.want&&!sp.userData.hid});
 cls.forEach(m=>{
  if(m.length===1&&!m[0].edge)return;
  m.forEach(p=>p.sp.visible=false);
  let cx=0,cy=0;m.forEach(p=>{cx+=p.q.x;cy+=p.q.y});cx/=m.length;cy/=m.length;if(innerWidth<=900){const em=mobile()?24:40;cx=Math.max(em,Math.min(innerWidth-em,cx));cy=kyY(cx,cy,em)}
  const cnt={};m.forEach(p=>{const g=groupOf(p.id);cnt[g]=(cnt[g]||0)+1});
  const dom=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  let b=clBtns[k];if(!b){b=document.createElement('button');b.className='clb num';host.appendChild(b);clBtns[k]=b}
  k++;b.style.display='';b.style.setProperty('--k',m.length>1?(1+Math.min(.34,(m.length-1)*.07)).toFixed(2):'1');b.style.setProperty('--c',GC[dom]||'#ffb547');b.style.translate=`${cx}px ${cy}px`;if(b._n!==m.length){const prev=b._n,from=prev||0,to=m.length;b._n=to;const tk=b._tk=(b._tk||0)+1;if(RM||!prev)b.textContent=to;else{const t0=performance.now();const stp=n=>{if(b._tk!==tk)return;const k=Math.min(1,(n-t0)/260);b.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(stp)};requestAnimationFrame(stp)}}
    b.setAttribute('aria-label',m.length===1?PARTS[m[0].id].name+'. Tap to open.':m.length+' parts here. Tap to zoom in.');b._m=m.map(p=>p.id)});
 for(let i=k;i<clBtns.length;i++){clBtns[i].style.display='none';clBtns[i]._m=null}
 dirty=true;
}
function clusterTap(b){noteAct();
 const ids=b._m;if(!ids)return;
 if(ids.length===1){select(ids[0]);return}
 const c=new THREE.Vector3();ids.forEach(id=>c.add(CEN[id]));c.divideScalar(ids.length);car.localToWorld(c);
 const L=$('#clist');L.innerHTML=ids.map(id=>`<button data-id="${id}"><span class="dot g-${groupOf(id)}"></span><b>${PARTS[id].name}</b></button>`).join('');
 const r=b.getBoundingClientRect();L.classList.add('on');
 const lh=L.offsetHeight;L.style.left=Math.max(10,Math.min(innerWidth-270,r.left-120))+'px';L.style.top=Math.max(10,Math.min(innerHeight-lh-10,r.bottom+8))+'px';
}
function pinScreen(sp){
 const v=sp.position.clone();car.localToWorld(v);v.project(camera);if(v.z>1)return null;
 return {x:(v.x*.5+.5)*innerWidth,y:(-v.y*.5+.5)*innerHeight};
}
function setupPick(){
 $('#cl').addEventListener('click',e=>{const b=e.target.closest('.clb');if(b)clusterTap(b)});
 $('#clist').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#clist').classList.remove('on');select(b.dataset.id)});
 addEventListener('pointerdown',e=>{if(!e.target.closest('#clist,.clb'))$('#clist').classList.remove('on')},true);
 const el=renderer.domElement;let d0=null;const ray=new THREE.Raycaster();const pt=new THREE.Vector2();
 el.addEventListener('pointerdown',e=>{d0={x:e.clientX,y:e.clientY,t:performance.now()}});
 el.addEventListener('pointerup',e=>{if(!d0)return;const mv=Math.hypot(e.clientX-d0.x,e.clientY-d0.y),dt=performance.now()-d0.t;d0=null;if(mv>8||dt>500)return;pickAt(e.clientX,e.clientY)});
 function pickAt(x,y){
  let best=null,bd=26;
  pinList.forEach(sp=>{if(!sp.visible)return;const q=pinScreen(sp);if(!q)return;const dd=Math.hypot(q.x-x,q.y-y);if(dd<bd){bd=dd;best=sp.userData.part}});
  if(best){select(best);return}
  pt.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(pt,camera);
  const hits=ray.intersectObjects(internals.visible?[internals,shell]:[shell],true);
  for(const hh of hits){let o=hh.object;while(o&&!o.userData.part)o=o.parent;if(o){select(o.userData.part);return}
   const lp=car.worldToLocal(hh.point.clone());let bi=null,bdist=1e9;
   Object.keys(PARTS).forEach(id=>{const dd=CEN[id].distanceTo(lp);if(dd<bdist){bdist=dd;bi=id}});
   if(bi&&bdist<1.0){select(bi);return}break}
 }
}

function frame(now){
 requestAnimationFrame(frame);
 const dt=lastT?Math.min(100,now-lastT):0;lastT=now;
 const idleOK=!HOLDCAM&&!RM&&S.ready&&S.view==='solid'&&!S.sel&&!S.sys&&!tweens.length&&!document.hidden&&!$('#clist').classList.contains('on')&&now-lastAct>5000&&turnMs<40000;
 if(idleOK)turnMs+=dt;controls.autoRotate=idleOK;
 for(let i=tweens.length-1;i>=0;i--){const t=tweens[i];const k=Math.min(1,(now-t.t0)/t.dur);t.fn(k);dirty=true;if(k>=1){tweens.splice(i,1);t.done&&t.done()}}
 if(S.offX!==S.offXT||S.offY!==S.offYT||!camera.view?.enabled){const k=RM?1:.18;S.offX+=(S.offXT-S.offX)*k;S.offY+=(S.offYT-S.offY)*k;if(Math.abs(S.offXT-S.offX)<.4)S.offX=S.offXT;if(Math.abs(S.offYT-S.offY)<.4)S.offY=S.offYT;
  camera.setViewOffset(innerWidth,innerHeight,S.offX,S.offY,innerWidth,innerHeight);dirty=true}
 if(!RM&&scene.environment&&S.view==='solid'&&!S.sel&&!document.hidden&&now-swT>40){SW+=Math.min(100,now-swT)*.00007;swT=now;scene.environmentRotation.y=.55*Math.sin(SW*Math.PI*2*1.0);dirty=true}
 if(HOLDCAM){if(!HOLDP){HOLDP=camera.position.clone();HOLDT=controls.target.clone()}camera.position.copy(HOLDP);controls.target.copy(HOLDT)}else HOLDP=null;
 if(controls.update())dirty=true;
 if(!RM&&S.sel&&pins[S.sel]&&pins[S.sel].visible){pins[S.sel].scale.setScalar(.04*(1+.09*Math.sin(now/230)));dirty=true}
 if(dirty){dirty=false;renderer.render(scene,camera);declutter(false)}
}
function setNote(){
 const n=$('#note');
 if(S.modelLoaded){n.className='';const op=!!window.__crOpen;n.innerHTML='<button id="crb" type="button" aria-expanded="'+op+'">Credits</button><div id="crl"'+(op?'':' hidden')+'><a href="https://sketchfab.com/3d-models/mercedes-benz-s600-w220-2005-us-spec-b347ac28947f4d2db9da222772401fdd" target="_blank" rel="noopener">Model: Mercedes-Benz S600 W220 2005</a><a href="https://sketchfab.com/szymonpasterczyk" target="_blank" rel="noopener">by Merc_TV</a><a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">Licence CC BY 4.0</a><a href="https://polyhaven.com/a/studio_small_09" target="_blank" rel="noopener">Light: Poly Haven studio_small_09 (CC0)</a></div>';const bt=n.querySelector('#crb');bt.onclick=()=>{window.__crOpen=!window.__crOpen;setNote()};if(op)bt.focus()}
 else{n.className='ph';n.textContent='PLACEHOLDER BODY. The real W220 model is not loaded yet. Part positions are approximate.'}
}
async function boot(){
 buildChrome();
 const ok=initGL();
 window.MERC={select,search:searchIndex,ready:true,gl:false};
 if(!ok){$('#hint').classList.add('off');return}
 const dayP=loadDaylight().catch(e=>console.warn('hdri failed, studio light kept',e));
 shell.add(buildPlaceholder());shell.visible=false;buildInternals();
 setupPick();resize();addEventListener('resize',resize);
 const h=homeCam();camera.position.copy(h.pos);controls.target.copy(h.tgt);controls.update();
 requestAnimationFrame(frame);applyShell();$('#note').textContent='';
 const gone=()=>{const p=$('#poster');if(p){p.classList.add('gone');setTimeout(()=>p.remove(),900)}};
 try{await dayP;if(await tryModel()){shell.visible=true;setNote();const h2=homeCam();S.homed=true;camera.position.copy(h2.pos);controls.target.copy(h2.tgt);controls.update();applyShell();renderer.render(scene,camera);gone();if(!RM){const t0c=h2.tgt.clone(),off=h2.pos.clone().sub(t0c),a0=-.42,t00=performance.now();const rs=(a)=>{const c=Math.cos(a),sn=Math.sin(a);return new THREE.Vector3(off.x*c+off.z*sn,off.y,-off.x*sn+off.z*c)};camera.position.copy(t0c).add(rs(a0));controls.update();dirty=true;tween(1500,k=>{const e=1-Math.pow(1-k,3);camera.position.copy(t0c).add(rs(a0*(1-e)));camera.lookAt(controls.target);controls.update()})}}else{shell.visible=true;setNote();dirty=true;gone()}}
 catch(e){console.warn('model load failed, placeholder kept',e);shell.visible=true;$('#note').textContent='PLACEHOLDER BODY. The model file could not be loaded.';gone()}
 $('#load').style.width='100%';setTimeout(()=>$('#load').style.opacity=0,300);
 dirty=true;S.ready=true;
 window.MERC={hold:v=>{HOLDCAM=!!v;controls.autoRotate=false},select,setView,search:searchIndex,state:()=>({sel:S.sel,view:S.view,p:S.p,e:S.e,sys:S.sys,model:S.modelLoaded,calls:renderer.info.render.calls,pinsVisible:pinList.filter(p=>p.visible).length,cam:camera.position.toArray(),tgt:controls.target.toArray()}),ready:true,gl:true,idle:()=>tweens.length===0,motion:()=>({rm:RM,auto:controls.autoRotate,az:controls.getAzimuthalAngle(),tweens:tweens.length}),setRM:v=>{RM=!!v},cover:()=>{const b=new THREE.Box3().setFromObject(shell),pts=[];for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const z of [b.min.z,b.max.z])pts.push(new THREE.Vector3(x,y,z).project(camera));const px=pts.map(p=>(p.x*.5+.5)*innerWidth),py=pts.map(p=>(-p.y*.5+.5)*innerHeight);return {x0:Math.min(...px),x1:Math.max(...px),y0:Math.min(...py),y1:Math.max(...py),W:innerWidth,H:innerHeight,free:S.free,off:[S.offX,S.offY]}},clusterCount:()=>clBtns.filter(b=>b._m).length,pinScreen:id=>pinScreen(pins[id])};
}
boot();
