<!doctype html>
<html lang="en">
<!-- x5d: x5c plus 5 fixes (tap area, entrance motion, 390 spacing, car fill and sweep, title) -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>S 320 fix guide</title>
<meta name="color-scheme" content="dark">
<style>
:root{--bg:#0e1215;--pl:#151b1f;--pl2:#1b2328;--hl:#252d33;--ink:#dde3e7;--dim:#8b979f;--sil:#c3cbd1;--amb:#e6a23c;--red:#e4431d;--go:#5fb58a;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--disp:"Avenir Next Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
h1,h2,h3,p,ul,ol{margin:0}
a{color:var(--sil)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sil);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding:0 16px 48px}
.plate{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--hl);font:12px/1.4 var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"liga" 0;color:var(--dim);letter-spacing:.02em}
.plate b{color:var(--ink);font-weight:500;overflow-wrap:anywhere}
.plate .t{font:600 12px var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--sil)}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
h1{font:600 26px/1.15 var(--disp);letter-spacing:.01em}
h2{font:600 12px/1.4 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:28px 0 8px}
.start{display:block}
.start>div:last-child{margin-top:24px}
@media(min-width:1024px) and (orientation:landscape){.start>div:last-child{margin-top:0}.start{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:start}.stagecol{position:sticky;top:12px}}
.stage{position:relative;height:clamp(240px,34svh,300px);margin:12px 0 0;background:radial-gradient(120% 90% at 50% 100%,#1c252b 0%,var(--bg) 70%);border:1px solid var(--hl);border-radius:6px;overflow:hidden;touch-action:pan-y}
@media(min-width:1024px) and (orientation:landscape){.stage{height:calc(100svh - 124px);min-height:520px;margin:0}}
@media(min-width:1024px) and (orientation:portrait){.stage{height:clamp(420px,42svh,640px)}.rows,.start>div:last-child{max-width:720px}}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.leads line{stroke:rgba(233,237,240,.6);stroke-width:1}
.leads circle{fill:#e9edf0}
.pin{position:absolute;left:0;top:0;width:44px;height:44px;display:grid;place-items:center;z-index:2}
.pin i{width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(14,18,21,.8),0 0 0 4px #e9edf0;transition:opacity .12s}
.pin[data-occ="1"] i{opacity:.28}
.pin[aria-pressed=true] i{background:#fff;box-shadow:0 0 0 3px var(--red)}
.bar{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-height:44px;margin-top:6px;font-size:13px}
.bar span{flex:1 1 150px;min-width:0}
.bar[data-sel="0"] span{color:var(--dim)}
.bar [hidden]{display:none}
.credit{margin-top:6px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:32px;min-width:44px;padding:0 12px;border:1px solid var(--hl);border-radius:6px;background:var(--pl2);color:var(--ink);font-size:13px;text-decoration:none}
.btn::before{content:"";position:absolute;inset:-8px -2px}
.btn.pri{background:var(--sil);color:#10151a;border-color:var(--sil);font-weight:600}
.btn.txt{background:none;border-color:transparent;color:var(--sil)}
.rows{list-style:none;padding:0;border-top:1px solid var(--hl)}
.rows a{display:grid;grid-template-columns:28px 1fr auto;gap:0 8px;align-items:center;min-height:56px;padding:6px 0;border-bottom:1px solid var(--hl);text-decoration:none;color:var(--ink)}
.rows .n{font:12px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.rows b{font-weight:600;font-size:14px;display:block}
.rows small{display:block;color:var(--dim);font-size:12px;line-height:1.35}
.rows .go{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sil);white-space:nowrap}
.rows a:hover b{color:#fff}
.fine{font-size:12px;color:var(--dim)}
.back{margin:8px 0 0 -12px}
.page{max-width:720px}
.where{color:var(--dim);margin-top:8px}
.diag{margin:16px 0;border:1px solid var(--hl);border-radius:6px;background:var(--pl);padding:6px}
.diag svg{display:block;width:100%;height:auto;max-height:300px;overflow:visible}
.diag svg text{font:13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--pl);stroke-width:3px;stroke-linejoin:round}
.diag svg .d{fill:var(--dim)}
.diag svg .ln{stroke:var(--sil);fill:none;stroke-width:1.3}
.diag svg .fb{stroke:var(--amb);fill:none;stroke-width:1.6}
.diag svg .bx{fill:var(--pl2);stroke:var(--sil);stroke-width:1}
.diag svg .hot{fill:var(--red)}
.diag svg .am{fill:var(--amb)}
.diag figcaption{font-size:12px;color:var(--dim);padding:4px 4px 0}
.tk{list-style:none;padding:0;border-top:1px solid var(--hl)}
.tk li{border-bottom:1px solid var(--hl)}
.tk label{display:grid;grid-template-columns:44px 1fr;align-items:start;min-height:44px;cursor:pointer}
.tk input{appearance:none;-webkit-appearance:none;width:44px;height:44px;margin:0;display:grid;place-items:center;cursor:pointer}
.tk input::before{content:"";width:18px;height:18px;border:1.5px solid var(--dim);border-radius:4px;display:block}
.tk input:checked::before{background:var(--go);border-color:var(--go);box-shadow:inset 0 0 0 3px var(--bg)}
.tk .tx{padding:10px 0}
.tk input:checked+.tx{color:var(--dim)}
.prog{font:12px var(--mono);color:var(--dim);margin-top:6px}
.tag{display:inline-block;font:600 12px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:3px;border:1px solid var(--amb);color:var(--amb);vertical-align:1px;white-space:nowrap}
.tag.g{border-color:var(--dim);color:var(--dim)}
.blk{background:var(--pl);border:1px solid var(--hl);border-radius:6px;padding:12px 14px;margin-top:12px}
.blk h3{font:600 13px/1.3 system-ui;margin-bottom:6px}
.blk p+p,.blk ul+p,.blk p+ul{margin-top:8px}
.blk ul{padding-left:18px}
.blk.warn{border-color:#5a4521}
.blk.safe{border-left:3px solid var(--amb)}
.blk.ans{border-left:3px solid var(--sil)}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
th,td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--hl);overflow-wrap:anywhere}
th{font-weight:500;color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
td.c{font:12px var(--mono);font-feature-settings:"liga" 0;color:var(--sil)}
.nx{margin-top:24px;padding:14px;border:1px solid var(--sil);border-radius:6px;background:var(--pl)}
.nx .lab{color:var(--sil)}
.pn{font:12px var(--mono);font-feature-settings:"liga" 0;overflow-wrap:anywhere}
.foot{margin-top:36px;padding-top:12px;border-top:1px solid var(--hl)}
#loadline{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--dim);z-index:1}
#qa{position:fixed;left:0;right:0;bottom:0;background:#000c;font:12px var(--mono);padding:4px 8px;z-index:9;max-height:30vh;overflow:auto;white-space:pre-wrap}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.rows li{animation:rise .4s both;animation-delay:calc(var(--i)*60ms)}
#view.enter>*{animation:rise .4s both}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>

<rect class="bx" x="128" y="8" width="104" height="44" rx="4"/><text x="180" y="28" text-anchor="middle">Compressor</text><text class="d" x="180" y="44" text-anchor="middle">front right</text>

const VIN='WDB2201652A227673';
const FAULTS={
stereo:{title:'Stereo cutting out',sub:'Works after off and on, dead next morning',
 where:'The head unit is in the dash. The cause is more likely in the boot: the amp, the CD changer and the fibre loop all sit on the left side behind the trim.',
 diag:{svg:SVG.fibre,cap:'The audio loop is one ring of fibre. One dead box in the ring drops the whole ring.'},
 blocks:[
  ['Your pattern',`<p>The radio has power and a screen but no sound. It came back once after switching off and on in the evening, then was gone the next morning. That pattern points at the boot, not the head unit: the amp, its power, or one box on the fibre loop that fails to wake up.</p>`,'ans'],
  ['What the water photos show',`<ul><li>Right tail light: heavy rust along the bottom seam. Water is getting in on the right side of the boot, near the 12 V battery.</li><li>CD changer bracket, left of the boot: heavy rust. Water has reached the left rack too, so the changer and amp are both at risk.</li></ul><p>Fix the leak before fitting any audio part.</p>`]
 ],
 checks:[
  ['Water in the boot first.','Lift the boot floor and the left trim. Feel for damp. Look at the right tail light seal and the rubber drain channels from the rear window pillar. Dry it out and find the leak.'],
  ['CD changer eject test.','Car and radio on, press eject on the changer. No whirr and the magazine stays in: no power, and that breaks the loop.'],
  ['D2B fibre bypass loop.','Car off, key out. Unplug the changer, join its two fibre ends with a D2B loop plug. Use the car for a week.'],
  ['Amp harness pins.','Car off, key out. Unplug each amp plug, look for green, white or rusty pins, push back until it clicks.'],
  ['Fuses.','F66 (25 A amp) and F61 (15 A radio, CD changer, COMAND) in K40/5 under the right rear seat. Also F23 (7.5 A CD changer), F24 (20 A audio), F25 (25 A sound system) in the front left box, F60 aerial amp in the rear module K40/5, and the pre-fuse box X4/22 by the battery. Check your own lid chart: numbers change by build date.']
 ],
 after:[
  ['F66 and F61: the audio fuses',`<p><b>F66 25 A = sound amplifier</b> on cars built up to Aug 2002 (yours, by plate MY2001). <b>F61 15 A = radio, CD changer, COMAND.</b> Both are in the box under the right rear seat (K40/5). From Sep 2002 F66 became a seat fuse. Your car was built before that (plate MY2001, serial 227673 sits in the 2001 run), so on your car F66 is the amp.</p>`,'warn'],
  ['Look up in the owner manual',`<p>Index terms: fuse allocation chart (a fold-out may be in the tool kit near the spare wheel), Sound System, CD Changer, Telephone and Voice Control.</p>`],
  ['Fuse photos and amp figures',`<p>Pictures of the audio fuses and the amp figures you asked for: <span class="tag g">not found yet</span>. Nothing is guessed here.</p>`]
 ],
 parts:['D2B fibre bypass coupler: <span class="pn">A 000 545 33 84</span> <span class="tag">UNCONFIRMED</span> for your VIN. Bypass the CD changer first, then suspect the amplifier. Price: not found yet.','Used CD changer: rough guess NZD 80 to 250.','Used amp (same part number): rough guess NZD 150 to 500.','Head unit last: rough guess NZD 300 to 700 to repair.'],
 fix:['Fix the water leak first, then dry and clean the plugs.','Leave the changer bypassed (you lose the CD changer only) or fit a good used one.','Replace the amp only if the bypass does not bring sound back or its plugs are badly corroded.'],
 safety:['12 V cannot shock you, even when wet. The real danger is a tool touching both battery terminals: sparks and burns.','Ignition off and key out before you unplug a module.','Orange cables are fibre optic: no power, but they snap if bent sharply.'],
 next:'Do the eject test on the CD changer. No whirr: bypass it and drive a week.'},
air:{title:'Air suspension and the right rear strut',sub:'Raise test first. The strut is a later buy',
 where:'Compressor: front right behind the bumper. Relay O and fuse F32 are in the right engine bay fuse box. The right rear strut is inside the right rear wheel arch.',
 diag:{svg:SVG.air,cap:'Air runs compressor, valve block, then the four struts. Your right rear strut is red.'},
 blocks:[
  ['What the scan says',`<p>The scan list has "Suspension (LWR)" and "Pneumatic System Equipment (PSE)", both read clear. No Airmatic module is named in it. <b>The air suspension module was never scanned by name.</b> No scan data for the air suspension yet: do the raise test.</p>`,'ans']
 ],
 checks:[
  ['Raise test.','Engine running, press the level button once. The car should rise within about 30 seconds. Listen at the front right bumper for the compressor hum.'],
  ['Read the dash message.','"AIRMATIC VISIT WORKSHOP" means a fault is stored. "Car too low" means it cannot build or hold pressure.'],
  ['Relay O and fuse F32 (40 A).','Pull F32 and look at it. Swap relay O with an identical relay and repeat the raise test.'],
  ['Overnight sag.','Park on flat ground. Measure each wheel arch to the ground in the evening and in the morning. The low corner points at the leak.'],
  ['Right rear strut.','Soapy water on the air fitting at the top. Bubbles mean a leak. The bag sits behind a cover so water may not reach it.'],
  ['Valve block, level sensors, reservoir.','Soapy water on the valve block joints. Look under each level sensor for a snapped link rod.']
 ],
 after:[
  ['Right rear strut: buy second hand',`<p>You said later, because it might not need one. Second-hand source in NZ or online: <span class="tag g">not found yet</span>. No NZ listing was searched in this round. Not a first fix.</p>`]
 ],
 parts:['Relay O: w220.wiki lists <span class="pn">A 002 542 13 19</span> <span class="tag">UNCONFIRMED</span> for VIN <span class="pn">'+VIN+'</span>. Rough guess NZD 40 to 120.','Rear strut: rough guess NZD 400 to 800 each, fitted 650 to 1,100.','Compressor: rough guess NZD 400 to 900, fitted 700 to 1,300.'],
 fix:['Replace a bad relay. Always fit a new relay with a new compressor.','Fix any leak before the compressor, or it wears out again.','Replace the leaking strut.'],
 safety:['Do not work under a car sitting on its air bags. Use axle stands on solid points.','Do not jack the car on the air struts.'],
 next:'Do the raise test. Hum and rise: measure the overnight sag. No hum: swap relay O.'},
ac:{title:'A/C not cold',sub:'4 scan codes, no pressure sensor code',
 where:'Fan: behind the radiator. Compressor: on the engine, belt driven. Condenser: in front of the radiator behind the grille. Scan: 2026-11-16 17:33, SN IP608-002065, 198,888 km.',
 diag:{svg:SVG.ac,cap:'Codes sit on the fan and the compressor. The pressure sensor B12 has no code.'},
 blocks:[
  ['Scan result: 27 systems read, 26 clear',`<table><thead><tr><th style="width:27%">Code</th><th>What it says</th><th style="width:21%">Status</th></tr></thead><tbody>
  <tr><td class="c">P20CD</td><td>Compressor torque implausible. Points at the A/C module.</td><td>Stored</td></tr>

  <tr><td class="c">P202C-08<br>(P0128)</td><td>Coolant thermostat.</td><td>Stored and current. The only live one.</td></tr>
  <tr><td class="c">P2073-04</td><td>Electric suction fan, open circuit.</td><td>Stored</td></tr></tbody></table><p class="fine" style="margin-top:8px">All four are in Motor Electronics 2. No freeze-frame values in the scan: none shown.</p>`],
  ['Pressure sensor: the plain answer',`<p><b>There is no pressure sensor code.</b> It is a suspect only. P20CD points at the A/C module, and sensor B12 comes after that. Check live pressure with a gauge before you buy one.</p>`,'ans'],
  ['Not scanned yet',`<p><b>The A/C module (AAC/TAC) and the air suspension module were never scanned.</b> Scan the A/C module next. Until then its status is unknown: nothing is assumed.</p>`,'warn'],
  ['Will the last code clear?',`<p>You said the last code will clear if the second is fixed, because they are related. The scan report puts the fan circuit first. The link between P2073 and P20D0 is about 70 percent likely <span class="tag">UNCONFIRMED</span>. Not a promise.</p>`]

 const r2=a=>Math.round(a*10)/10;return {stage:{w,h},box:{x0:r2(x0),y0:r2(y0),x1:r2(x1),y1:r2(y1)},inside:x0>=0&&y0>=0&&x1<=w&&y1<=h,margin_px:{l:r2(x0),r:r2(w-x1),t:r2(y0),b:r2(h-y1)},centre_offset_px:{dx:r2((x0+x1)/2-w/2),dy:r2((y0+y1)/2-h/2)},coverage_pct:{width:r2(100*(x1-x0)/w),height:r2(100*(y1-y0)/h),area:r2(100*(x1-x0)*(y1-y0)/(w*h))},samples:n}}
function sweep(){const cam=camera.clone();cam.aspect=w/h;cam.updateProjectionMatrix();const d=camera.position.distanceTo(controls.target),dir=camera.position.clone().sub(controls.target).normalize(),el=Math.asin(dir.y);let worst=null,all=[];
 const az0=Math.atan2(HOMEDIR.x,HOMEDIR.z);for(let k=-5;k<=5;k++){const az=az0+k*Math.PI/36;cam.position.set(controls.target.x+d*Math.cos(el)*Math.sin(az),controls.target.y+d*Math.sin(el),controls.target.z+d*Math.cos(el)*Math.cos(az));cam.lookAt(controls.target);const m=measure(cam);all.push(m.inside);const mm=Math.min(m.margin_px.l,m.margin_px.r,m.margin_px.t,m.margin_px.b);if(!worst||mm<worst.mm)worst={mm,az_deg:k*5,...m}}

function chip(p){const c=document.getElementById('chip');if(!c)return;const t=document.getElementById('chiptxt'),go=document.getElementById('chipgo'),rs=document.getElementById('reset');

const ray=new THREE.Raycaster();

 pts.forEach(q=>{const b=pinEls[q.i];if(!b)return;b.style.transform=`translate(${(q.x-22).toFixed(1)}px,${(q.y-22).toFixed(1)}px)`;b.style.visibility=q.off?'hidden':'visible';b.dataset.occ=occ[q.i]?'1':'0';
  const le=leadEls[q.i];if(le){const far=Math.hypot(q.x-q.tx,q.y-q.ty)>8&&!q.off;le[0].style.display=le[1].style.display=far?'':'none';if(far){le[0].setAttribute('x1',q.tx);le[0].setAttribute('y1',q.ty);le[0].setAttribute('x2',q.x);le[0].setAttribute('y2',q.y);le[1].setAttribute('cx',q.tx);le[1].setAttribute('cy',q.ty)}}})}

 root.traverse(o=>{if(!o.isMesh)return;const sw=m=>{const n=(m&&m.name)||'';if(MODEL.paint.includes(n)){hit('paint',n);return paint}if(MODEL.glass.includes(n)){hit('glass',n);return glass}if(MODEL.chrome.includes(n)){hit('chrome',n);return chrome}return m};o.material=Array.isArray(o.material)?o.material.map(sw):sw(o.material)});

  wh.updateWorldMatrix(true,true);const bb=new THREE.Box3().setFromObject(wh),cc=bb.getCenter(new THREE.Vector3());const tgt=new THREE.Vector3(wx,.345,sz2*.84);const inv=wh.parent.matrixWorld.clone().invert();

  const dk=new THREE.Mesh(new THREE.CylinderGeometry(.185,.185,.022,36),discMat);dk.rotation.x=Math.PI/2;dk.position.set(wx,.345,sz2*.70);extra.push(dk)});

 { const ms=[];holder.traverse(o=>{if(o.isMesh&&o.visible)ms.push(o)});const rc=new THREE.Raycaster();
